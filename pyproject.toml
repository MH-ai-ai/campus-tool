[project]
name = "campus-guard"
version = "0.1.0"
description = "Campus network keepalive and battery monitor for Windows."
requires-python = ">=3.12,<3.14"
dependencies = [
  "psutil>=5.9.0",
  "python-telegram-bot>=20.0,<22.0",
  "requests>=2.31.0",
  "Pillow>=10.0.0",
  "cryptography>=41.0.0",
  "PyQt6>=6.5.0",
]

[tool.setuptools]
packages = ["campus_guard"]
