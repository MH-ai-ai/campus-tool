<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>安澜</title>
    <style>
      /* 桌面原生触感：全局禁用误选，表单与日志划选区开放文本选择 */
      body {
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
      }
      input, textarea, .select-text, .select-text * {
        user-select: text;
        -webkit-user-select: text;
      }
      /* 浅色典雅滚动条 */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(24, 32, 44, 0.16);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(24, 32, 44, 0.28);
      }
    </style>
  </head>
  <body class="bg-[#eef2f7] text-[#18202c] font-sans antialiased overflow-hidden select-none m-0 p-0 h-screen w-screen">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
