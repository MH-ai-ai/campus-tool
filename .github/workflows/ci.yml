name: Campus Guard CI & Release Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Build Webview Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests -v

  build-release:
    name: Build Windows x64 Portable Executable
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Webview Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Package Windows Executable with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean CampusGuard.spec
          Copy-Item "config.example.json" -Destination "dist\CampusGuard\config.example.json" -Force

      - name: Archive Release Bundle (Zip)
        run: |
          Compress-Archive -Path "dist\CampusGuard\*" -DestinationPath "CampusGuard-Windows-x64.zip"
          Copy-Item "CampusGuard-Windows-x64.zip" -Destination "CampusGuard-${{ github.ref_name }}-Windows-x64.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusGuard-Windows-x64
          path: CampusGuard-Windows-x64.zip
          retention-days: 14

      - name: Create GitHub Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Campus Guard ${{ github.ref_name }} (Windows x64)"
          body_path: RELEASE_NOTES.md
          files: |
            CampusGuard-${{ github.ref_name }}-Windows-x64.zip
            CampusGuard-Windows-x64.zip
          draft: false
          prerelease: false
