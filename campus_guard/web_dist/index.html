        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(24, 32, 44, 0.16);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(24, 32, 44, 0.28);
      }
